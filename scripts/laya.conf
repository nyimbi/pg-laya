# systemd unit for the Laya HTTP server that the jev extension talks to.
#
#   make install-serve      # installs this as /etc/systemd/system/laya.service
#
# Drop secrets into /etc/laya/env (mode 0600) rather than into the unit file:
#   LAYA_API_KEY=<token>
#   LAYA_LOG_LEVEL=info
#
# The unit preloads checkpoints at boot so the first jev() call is not paying model load.
[Unit]
Description=Laya System-1 decision server for pg-jev
After=network.target

[Service]
Type=simple
User=postgres
Group=postgres
EnvironmentFile=/etc/laya/env
ExecStart=/usr/bin/python3 -m laya.serve
Restart=on-failure
RestartSec=3
# Laya runs one forward pass at a time; jev.concurrency is kept low (2-4) to match.
# Set LAYA_THREADS to <= physical cores on CPU hosts.

[Install]
WantedBy=multi-user.target
