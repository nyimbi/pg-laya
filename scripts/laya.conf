# systemd unit template for the Laya HTTP server that the laya extension talks to.
#
#   make install        # installs the extension and this unit (as /etc/systemd/system/laya.service)
#   make install-serve  # (re)install just the unit
#
# scripts/install_service.sh renders this template (the python3 in ExecStart is substituted for the one it
# found on the machine), and puts LAYA_HOST / LAYA_PORT / LAYA_API_KEY from the environment into
# /etc/laya/env (mode 0600). LAYA_API_KEY is optional: without it the server needs no auth and the
# extension sends no Authorization header either.
#
# The unit preloads checkpoints at boot (LAYA_PRELOAD=1) so the first laya() call is not paying model load.
# Health probe:  curl -fsS http://127.0.0.1:8000/health
#
[Unit]
Description=Laya System-1 decision server for pg-laya
After=network.target

[Service]
Type=simple
User=postgres
Group=postgres
EnvironmentFile=/etc/laya/env
ExecStart=__PYTHON3__ -m laya.serve
Restart=on-failure
RestartSec=3
# Laya runs one forward pass at a time; keep laya.concurrency low (2-4) to match.
# Set LAYA_THREADS (in /etc/laya/env) to <= physical cores on CPU hosts.

[Install]
WantedBy=multi-user.target
